# On every push to main (and pull request): builds and checks everything that doesn't need the
# game - the build container, the PS5 payload SDK, the Linux rexglue tool, and the SDK, Xenos
# plugin and launcher compiled for the PS5 (./build.sh --check). GitHub's own machines never have
# the game's default.xex, so the check builds no app.
#
# When a push to main changes VERSION.txt to a version that has no tag yet, the owner's Mac builds
# the app and tags it (v0.2.0) as a release with the zip and the changes since the last one.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (no game)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      SCB_STORAGE_DIR: ${{ github.workspace }}/../storage
    steps:
      - name: Make room
        # The runner starts with ~14 GB free; the SDK build needs more.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Versions of the dependencies
        id: deps
        run: |
          echo "plume=$(git rev-parse HEAD:thirdparty/ps5-plume-triangle)" >> "$GITHUB_OUTPUT"

      - name: Restore the PS5 payload SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.SCB_STORAGE_DIR }}/plume-deps
          key: plume-deps-${{ steps.deps.outputs.plume }}-${{ hashFiles('docker/Dockerfile') }}

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCB_STORAGE_DIR }}/cache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Build and check
        env:
          CCACHE_MAXSIZE: 3G
        run: ./build.sh --check

      - name: Compiler cache use
        if: always()
        run: ./dev.sh bash -c 'ccache --show-stats 2>/dev/null | head -20 || true'

  # Built on the owner's own Mac (a self-hosted runner labelled splinter-cell), the only place with
  # the disc: its default.xex comes from the folder in the repository variable DISC_FILES_DIR. The
  # release, with the zip, is as private as this repository.
  release:
    name: Release (when VERSION.txt changes)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, splinter-cell]
    timeout-minutes: 600
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: New version?
        id: version
        run: |
          version=v$(tr -d '[:space:]' < VERSION.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "$version is already tagged: no new release (bump VERSION.txt to make one)."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the app
        if: steps.version.outputs.new == 'true'
        env:
          DISC_FILES_DIR: ${{ vars.DISC_FILES_DIR }}
        run: |
          mkdir -p disc-files/disc1
          cp "$DISC_FILES_DIR/disc1/default.xex" disc-files/disc1/
          ./build.sh

      - name: Release with the zip
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<EOF
          Install: unzip, copy the \`PPSA90827\` folder to \`/data/homebrew/\` on the PS5, then
          your own discs into its \`game/disc1/\` and \`game/disc2/\` (see the README).
          EOF
          gh release create "$VERSION" "dist/splinter-cell-blacklist-ps5-$VERSION.zip" \
            --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md --generate-notes
